[project]
name = "address-book"
version = "1.0.0"
description = "Minimal FastAPI address book with coordinates and distance search."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
